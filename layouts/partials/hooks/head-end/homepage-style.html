{{ if .IsHome }}
<style>
  :root {
    --home-bg: #f6f3ed;
    --home-surface: rgba(255, 255, 255, 0.82);
    --home-surface-strong: rgba(255, 255, 255, 0.94);
    --home-border: rgba(26, 74, 74, 0.12);
    --home-text: #1b2929;
    --home-muted: #566666;
    --home-accent: #176b6b;
    --home-accent-soft: #deeeea;
    --home-shadow: 0 24px 70px rgba(27, 41, 41, 0.08);
    --home-radius-lg: 28px;
    --home-radius-md: 22px;
  }

  body {
    background:
      radial-gradient(circle at top left, rgba(225, 240, 235, 0.85), transparent 32%),
      radial-gradient(circle at top right, rgba(233, 229, 247, 0.55), transparent 26%),
      linear-gradient(180deg, #fbfaf7 0%, var(--home-bg) 100%);
    color: var(--home-text);
    font-family: "Avenir Next", "Segoe UI", sans-serif;
  }

  h1, h2, h3, .article-title {
    color: var(--home-text);
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    letter-spacing: -0.02em;
  }

  .navbar {
    background: rgba(251, 250, 247, 0.84);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(26, 74, 74, 0.08);
  }

  .home-section {
    position: relative;
  }

  .home-hero-section {
    padding-top: 2rem;
  }

  .home-hero-section .resume-biography {
    align-items: center;
    gap: clamp(2.5rem, 5vw, 5rem);
    margin: 0 auto;
    max-width: min(76vw, 1380px);
    padding-inline: 1.5rem;
  }

  .home-hero-section .resume-biography > .flex-auto {
    flex: 0 1 min(72vw, 1100px);
    max-width: min(72vw, 1100px);
  }

  .home-focus-section > .flex,
  .home-timeline-section > .flex {
    margin-inline: auto;
    max-width: min(75vw, 1320px);
    width: min(75vw, 1320px);
  }

  .home-focus-section .prose,
  .home-timeline-section .prose,
  .home-hero-section .prose {
    max-width: none;
    width: 100%;
  }

  .home-hero-section .home-section-bg {
    opacity: 0.25;
  }

  .home-hero-section .wg-resume-biography-3 {
    position: relative;
    overflow: hidden;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title,
  .home-hero-section .wg-resume-biography-3 .bio-text,
  .home-hero-section .wg-resume-biography-3 .network-icon {
    color: var(--home-text);
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title h2 {
    font-size: clamp(2.8rem, 5vw, 4.6rem);
    line-height: 0.95;
    margin-bottom: 0.6rem;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title h3,
  .home-hero-section .wg-resume-biography-3 .portrait-title .article-metadata {
    color: var(--home-muted);
    font-size: 1rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .home-hero-section .wg-resume-biography-3 .bio-text {
    max-width: min(75vw, 1100px);
    font-size: 1.08rem;
    line-height: 1.95;
  }

  .home-hero-section .grid.grid-cols-1.md\:grid-cols-2 {
    display: none;
  }

  .home-hero-section .avatar {
    border: 6px solid rgba(255, 255, 255, 0.65);
    box-shadow: var(--home-shadow);
  }

  .home-focus-section .section-heading,
  .home-timeline-section .section-heading {
    margin-bottom: 1.5rem;
  }

  .home-focus-section > .flex > .mb-6,
  .home-timeline-section > .flex > .mb-6 {
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: clamp(2.5rem, 4vw, 3.5rem);
    letter-spacing: -0.04em;
    line-height: 0.98;
    margin-bottom: 2rem;
    text-align: center;
  }

  .home-focus-section .section-subheading,
  .home-timeline-section .section-subheading {
    color: var(--home-muted);
    font-size: 1rem;
  }

  .home-grid {
    display: grid;
    gap: 1.25rem;
  }

  .home-focus-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem;
  }

  .home-card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(250, 248, 243, 0.92) 100%);
    border: 1px solid var(--home-border);
    border-radius: var(--home-radius-md);
    box-shadow: 0 20px 50px rgba(27, 41, 41, 0.08);
    backdrop-filter: blur(12px);
  }

  .home-focus-card {
    min-height: 260px;
    padding: 1.9rem 1.8rem;
  }

  .home-card p,
  .home-lead-copy p,
  .home-timeline-item p {
    color: var(--home-muted);
    line-height: 1.8;
    margin: 0;
  }

  .home-focus-card h3 {
    font-size: clamp(1.45rem, 2vw, 1.8rem);
    line-height: 1.08;
    margin-bottom: 1rem;
    max-width: 12ch;
  }

  .home-lead-copy {
    display: grid;
    gap: 1.15rem;
    margin-top: 2rem;
    max-width: min(75vw, 1180px);
  }

  .home-lead-copy p {
    font-size: 1.08rem;
    line-height: 1.95;
  }

  .home-timeline {
    display: grid;
    gap: 1.15rem;
  }

  .home-timeline-item {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.97) 0%, rgba(248, 245, 239, 0.93) 100%);
    border: 1px solid var(--home-border);
    border-radius: var(--home-radius-md);
    box-shadow: 0 18px 46px rgba(27, 41, 41, 0.07);
    padding: 1.45rem 1.6rem;
  }

  .home-timeline-item span {
    color: var(--home-accent);
    display: inline-block;
    font-size: 0.84rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 0.45rem;
    text-transform: uppercase;
  }

  @media (max-width: 991.98px) {
    .home-focus-grid {
      grid-template-columns: 1fr;
    }

    .home-hero-section .resume-biography,
    .home-hero-section .resume-biography > .flex-auto,
    .home-focus-section > .flex,
    .home-timeline-section > .flex,
    .home-hero-section .wg-resume-biography-3 .bio-text,
    .home-lead-copy {
      max-width: 100%;
      width: 100%;
    }

    .home-hero-section .wg-resume-biography-3 .portrait-title h2 {
      font-size: clamp(2.3rem, 10vw, 3.5rem);
    }
  }

  @media (max-width: 767.98px) {
    .home-focus-card,
    .home-timeline-item {
      padding: 1.2rem;
    }
  }
</style>
{{ end }}
