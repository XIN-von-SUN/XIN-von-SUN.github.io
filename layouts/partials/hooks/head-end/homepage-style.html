    z-index: 1;

    display: flex;
    justify-content: center;
    padding-top: 0;
    width: 100%;

  .home-hero-section .resume-biography > .flex-auto {
    display: contents;
  }

    align-items: center;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.84) 0%, rgba(247, 245, 241, 0.72) 100%);

    box-shadow: 0 10px 24px rgba(31, 42, 49, 0.035);
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    min-height: 340px;
    padding: 1.6rem 1.35rem 1.3rem;
    text-align: center;
    width: 100%;
  }

  .home-focus-section > .flex,
  .home-timeline-section > .flex {
    margin-inline: auto;
    max-width: min(75vw, 1320px);
    width: min(75vw, 1320px);

  .home-timeline-section .prose,
  .home-hero-section .prose {
    max-width: none;
    width: 100%;
  }

  .home-hero-section .home-section-bg {
    opacity: 0.25;
  }

  .home-hero-section .wg-resume-biography-3 {
    position: relative;
    overflow: hidden;
  }

  .home-hero-section #profile.flex.flex-col.items-center {
    align-items: center;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title,
  .home-hero-section .wg-resume-biography-3 .bio-text,
  .home-hero-section .wg-resume-biography-3 .network-icon {
    color: var(--home-text);

  .home-hero-section .wg-resume-biography-3 .portrait-title h2 {
    font-size: clamp(3rem, 5vw, 4.2rem);
    font-weight: 700;
    line-height: 0.95;
    margin-bottom: 0.45rem;
  }

  .home-hero-section .avatar-wrapper {
    align-self: center;
    display: flex;
    justify-content: center;
    margin-top: 0.35rem;
    position: relative;
    width: 100%;
  }

  .home-hero-section .avatar-wrapper::after {
    background: radial-gradient(circle, rgba(145, 159, 171, 0.1) 0%, rgba(145, 159, 171, 0) 72%);

    position: absolute;
    z-index: -1;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title .article-metadata {

    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

    margin-top: 1rem;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title div {
    line-height: 1.6;
  }

  .home-hero-section .wg-resume-biography-3 .bio-text {
    display: none;
  }

    align-items: stretch;
    display: contents;
    margin-top: 0;
    max-width: none;
    width: 100%;
  }

  .home-hero-section .grid.grid-cols-1.md\:grid-cols-2 > div {

    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    min-height: 100%;

    order: 2;
  }

  .home-hero-section .grid.grid-cols-1.md\:grid-cols-2 > :last-child {
    order: 1;
  }

  .home-hero-section .section-subheading {
    color: var(--home-text);
    font-size: 1.35rem;
    font-weight: 680;
    letter-spacing: -0.04em;
    line-height: 1.1;
    margin-bottom: 1rem;
  }

  .home-hero-section ul.list-disc,
  .home-hero-section .description,
  .home-hero-section .text-sm,
  .home-hero-section .course {
    color: var(--home-muted);
  }

  .home-hero-section ul.list-disc {
    font-size: 1.14rem;
    line-height: 1.9;
  }

  .home-hero-section ul > li.flex.items-start.gap-3 {
    margin-bottom: 1rem;
  }

  .home-hero-section .course {
    font-size: 1.2rem;
    font-weight: 640;
    letter-spacing: -0.025em;
    line-height: 1.3;
    color: var(--home-text);
    margin-bottom: 0.25rem;
  }

  .home-hero-section .description,
  .home-hero-section .text-sm {
    font-size: 1.05rem;
    line-height: 1.7;
  }

  .home-hero-section .avatar {
    border: 6px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 12px 28px rgba(31, 42, 49, 0.1);
    display: block;
    margin-inline: auto;
  }

  .home-hero-section .portrait-title {
    text-align: center;
    width: 100%;
  }

  .home-hero-section #profile,
  .home-hero-section .grid.grid-cols-1.md\:grid-cols-2 > div {
    min-height: 340px;
  }

  .home-hero-section #profile .portrait-title h2 {
    font-size: clamp(2.6rem, 4vw, 3.6rem);
  }

  .home-hero-section #profile .portrait-title h3 {
    margin-top: 0.15rem;
  }

    font-size: 1rem;
    letter-spacing: -0.015em;
    text-transform: none;

  .home-hero-section #profile .avatar-wrapper,

    margin-inline: auto;
  }

    width: 100%;

    justify-content: center;
    margin-top: auto;
    padding-top: 1.25rem;
  }

    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(32, 45, 52, 0.035);

    letter-spacing: -0.04em;
    line-height: 0.98;
    margin-bottom: 2rem;
    text-align: center;
  }

  .home-focus-section .section-subheading,
  .home-timeline-section .section-subheading {
    color: var(--home-muted);
    font-size: 1rem;
  }

    justify-items: center;
    text-align: center;
  }

    margin-inline: auto;
    max-width: 56rem;
    text-align: center;
  }

    box-sizing: border-box;
    margin-inline: auto;
    margin-top: 2rem;
    max-width: 100%;
    width: 100%;
  }

    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(31, 42, 49, 0.08);
    display: block;
    height: auto;
    margin-inline: auto;
    width: 100%;
  }

    display: grid;
    gap: 1.25rem;
  }

  .home-focus-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem;
  }

  .home-card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(250, 248, 243, 0.92) 100%);
    border: 1px solid var(--home-border);
    border-radius: var(--home-radius-md);
    box-shadow: 0 20px 50px rgba(27, 41, 41, 0.08);
    backdrop-filter: blur(12px);
  }

  .home-focus-card {
    min-height: 260px;
    padding: 1.9rem 1.8rem;
  }

  .home-card p,
  .home-lead-copy p,
  .home-timeline-item p {
    color: var(--home-muted);
    line-height: 1.8;
    margin: 0;
  }

  .home-focus-card h3 {
    font-size: clamp(1.45rem, 2vw, 1.8rem);
    line-height: 1.08;
    margin-bottom: 1rem;
    max-width: 12ch;
  }

  .home-lead-copy {
    display: grid;
    gap: 1.15rem;
    margin-top: 2rem;
    max-width: min(75vw, 1180px);
  }

  .home-lead-copy p {
    font-size: 1.08rem;
    line-height: 1.95;
  }

  .home-timeline {
    display: grid;
    gap: 1.15rem;
  }

  .home-timeline-item {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.97) 0%, rgba(248, 245, 239, 0.93) 100%);
    border: 1px solid var(--home-border);
    border-radius: var(--home-radius-md);
    box-shadow: 0 18px 46px rgba(27, 41, 41, 0.07);
    padding: 1.45rem 1.6rem;
  }

  .home-timeline-item span {
    color: var(--home-accent);
    display: inline-block;
    font-size: 0.84rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 0.45rem;
    text-transform: uppercase;
  }

  .home-timeline-more {
    margin-top: 1.35rem;
  }

  .home-timeline-more:not(:has(.home-timeline-item)) {
    display: none;
  }

  .home-timeline-more summary {
    background: rgba(255, 255, 255, 0.84);
    border: 1px solid rgba(32, 45, 52, 0.07);
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(31, 42, 49, 0.05);
    color: var(--home-text);
    cursor: pointer;
    display: block;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 0.98rem;
    font-weight: 600;
    margin: 0 auto;
    padding: 0.85rem 1.6rem;
    text-align: center;
    transition: background-color 0.2s ease, transform 0.2s ease;
    width: fit-content;
  }

  .home-timeline-more summary:hover {
    background: rgba(255, 255, 255, 0.96);
    transform: translateY(-1px);
  }

  .home-timeline-more summary::-webkit-details-marker {
    display: none;
  }

  .home-timeline-extra {
    margin-top: 1.35rem;
  }

  @media (max-width: 991.98px) {
    .home-focus-grid {
      grid-template-columns: 1fr;
    }

    .home-hero-section .resume-biography,
    .home-hero-section .resume-biography > .flex-auto,
    .home-focus-section > .flex,
    .home-timeline-section > .flex,
    .home-hero-section .grid.grid-cols-1.md\:grid-cols-2,
    .home-lead-copy {
      max-width: 100%;
      width: 100%;
    }

    .home-hero-section .resume-biography {
      grid-template-columns: 1fr;
    }

    .home-hero-section .grid.grid-cols-1.md\:grid-cols-2 {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: 1fr;
    }

    .home-hero-section #profile,
    .home-hero-section .grid.grid-cols-1.md\:grid-cols-2 > div {
      min-height: auto;
    }

    .home-hero-section .wg-resume-biography-3 .portrait-title h2 {
      font-size: clamp(2.3rem, 10vw, 3.5rem);
    }
  }

  @media (max-width: 767.98px) {
    .home-focus-card,
    .home-timeline-item {
      padding: 1.2rem;
    }
  }
</style>
{{ end }}

<style>
