{{ if .IsHome }}
<style>
  :root {
    --home-bg: #f6f3ed;
    --home-surface: rgba(255, 255, 255, 0.82);
    --home-surface-strong: rgba(255, 255, 255, 0.94);
    --home-border: rgba(26, 74, 74, 0.12);
    --home-text: #1b2929;
    --home-muted: #566666;
    --home-accent: #176b6b;
    --home-accent-soft: #deeeea;
    --home-shadow: 0 24px 70px rgba(27, 41, 41, 0.08);
    --home-radius-lg: 28px;
    --home-radius-md: 22px;
  }

  body {
    background:
      radial-gradient(circle at top left, rgba(225, 240, 235, 0.85), transparent 32%),
      radial-gradient(circle at top right, rgba(233, 229, 247, 0.55), transparent 26%),
      linear-gradient(180deg, #fbfaf7 0%, var(--home-bg) 100%);
    color: var(--home-text);
    font-family: "Avenir Next", "Segoe UI", sans-serif;
  }

  h1, h2, h3, .article-title {
    color: var(--home-text);
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    letter-spacing: -0.02em;
  }

  .navbar {
    background: rgba(251, 250, 247, 0.84);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(26, 74, 74, 0.08);
  }

  .home-section {
    position: relative;
  }

  .home-hero-section {
    padding-top: 2rem;
  }

  .home-hero-section .resume-biography {
    align-items: stretch;
    gap: clamp(2rem, 4vw, 4rem);
    margin: 0 auto;
    max-width: min(76vw, 1380px);
    padding-inline: 1.5rem;
  }

  .home-hero-section .resume-biography > * {
    position: relative;
  }

  .home-hero-section .resume-biography > .flex-none {
    display: flex;
    justify-content: center;
    padding-top: 0.5rem;
  }

  .home-hero-section #profile {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, rgba(247, 243, 236, 0.5) 100%);
    border: 1px solid rgba(26, 74, 74, 0.05);
    border-radius: 28px;
    box-shadow: 0 16px 40px rgba(27, 41, 41, 0.045);
    min-width: 272px;
    padding: 1.3rem 1.25rem 1.2rem;
  }

  .home-hero-section .resume-biography > .flex-auto {
    flex: 0 1 min(72vw, 1100px);
    max-width: min(72vw, 1100px);
  }

  .home-focus-section > .flex,
  .home-timeline-section > .flex {
    margin-inline: auto;
    max-width: min(75vw, 1320px);
    width: min(75vw, 1320px);
  }

  .home-focus-section .prose,
  .home-timeline-section .prose,
  .home-hero-section .prose {
    max-width: none;
    width: 100%;
  }

  .home-hero-section .home-section-bg {
    opacity: 0.25;
  }

  .home-hero-section .wg-resume-biography-3 {
    position: relative;
    overflow: hidden;
  }

  .home-hero-section .wg-resume-biography-3 .flex.flex-col.items-center {
    align-items: flex-start;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title,
  .home-hero-section .wg-resume-biography-3 .bio-text,
  .home-hero-section .wg-resume-biography-3 .network-icon {
    color: var(--home-text);
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title h2 {
    font-size: clamp(3rem, 5.2vw, 4.8rem);
    font-weight: 700;
    line-height: 0.92;
    margin-bottom: 0.55rem;
  }

  .home-hero-section .avatar-wrapper {
    margin-top: 0.35rem;
    position: relative;
  }

  .home-hero-section .avatar-wrapper::after {
    background: radial-gradient(circle, rgba(181, 154, 109, 0.18) 0%, rgba(181, 154, 109, 0) 74%);
    content: "";
    inset: -14px;
    position: absolute;
    z-index: -1;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title h3,
  .home-hero-section .wg-resume-biography-3 .portrait-title .article-metadata {
    color: #6b6155;
    font-size: 0.96rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title {
    margin-top: 1rem;
  }

  .home-hero-section .wg-resume-biography-3 .portrait-title p,
  .home-hero-section .wg-resume-biography-3 .portrait-title div {
    line-height: 1.6;
  }

  .home-hero-section .wg-resume-biography-3 .bio-text {
    max-width: min(75vw, 1100px);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, rgba(248, 244, 237, 0.48) 100%);
    border: 1px solid rgba(26, 74, 74, 0.05);
    border-radius: 24px;
    box-shadow: 0 14px 36px rgba(27, 41, 41, 0.04);
    color: #334646;
    font-size: 1.14rem;
    line-height: 1.9;
    padding: 1.15rem 1.35rem;
  }

  .home-hero-section .grid.grid-cols-1.md\:grid-cols-2 {
    display: grid;
    gap: 1.35rem 1.7rem;
    margin-top: 1.35rem;
    max-width: min(72vw, 1100px);
    width: 100%;
  }

  .home-hero-section .grid.grid-cols-1.md\:grid-cols-2 > div {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.84) 0%, rgba(250, 247, 242, 0.72) 100%);
    border: 1px solid rgba(26, 74, 74, 0.06);
    border-radius: 24px;
    padding: 1.5rem 1.6rem;
    box-shadow: 0 14px 38px rgba(27, 41, 41, 0.045);
    backdrop-filter: blur(12px);
  }

  .home-hero-section .section-subheading {
    color: var(--home-text);
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 0.8rem;
  }

  .home-hero-section ul.list-disc,
  .home-hero-section .description,
  .home-hero-section .text-sm,
  .home-hero-section .course {
    color: var(--home-muted);
  }

  .home-hero-section ul.list-disc {
    line-height: 1.8;
  }

  .home-hero-section ul > li.flex.items-start.gap-3 {
    margin-bottom: 0.9rem;
  }

  .home-hero-section .course {
    font-weight: 600;
    color: var(--home-text);
    margin-bottom: 0.15rem;
  }

  .home-hero-section .avatar {
    border: 6px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 22px 50px rgba(27, 41, 41, 0.12);
  }

  .home-hero-section .portrait-title {
    text-align: center;
    width: 100%;
  }

  .home-hero-section .network-icon {
    gap: 0.55rem;
    justify-content: center;
    margin-top: 0.85rem;
  }

  .home-hero-section .network-icon li a {
    align-items: center;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(26, 74, 74, 0.06);
    border-radius: 999px;
    display: inline-flex;
    height: 2.8rem;
    justify-content: center;
    transition: transform 0.2s ease, background-color 0.2s ease;
    width: 2.8rem;
  }

  .home-hero-section .network-icon li a:hover {
    background: rgba(255, 255, 255, 0.95);
    transform: translateY(-1px);
  }

  .home-focus-section .section-heading,
  .home-timeline-section .section-heading {
    margin-bottom: 1.5rem;
  }

  .home-focus-section > .flex > .mb-6,
  .home-timeline-section > .flex > .mb-6 {
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: clamp(2.5rem, 4vw, 3.5rem);
    letter-spacing: -0.04em;
    line-height: 0.98;
    margin-bottom: 2rem;
    text-align: center;
  }

  .home-focus-section .section-subheading,
  .home-timeline-section .section-subheading {
    color: var(--home-muted);
    font-size: 1rem;
  }

  .home-grid {
    display: grid;
    gap: 1.25rem;
  }

  .home-focus-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.5rem;
  }

  .home-card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(250, 248, 243, 0.92) 100%);
    border: 1px solid var(--home-border);
    border-radius: var(--home-radius-md);
    box-shadow: 0 20px 50px rgba(27, 41, 41, 0.08);
    backdrop-filter: blur(12px);
  }

  .home-focus-card {
    min-height: 260px;
    padding: 1.9rem 1.8rem;
  }

  .home-card p,
  .home-lead-copy p,
  .home-timeline-item p {
    color: var(--home-muted);
    line-height: 1.8;
    margin: 0;
  }

  .home-focus-card h3 {
    font-size: clamp(1.45rem, 2vw, 1.8rem);
    line-height: 1.08;
    margin-bottom: 1rem;
    max-width: 12ch;
  }

  .home-lead-copy {
    display: grid;
    gap: 1.15rem;
    margin-top: 2rem;
    max-width: min(75vw, 1180px);
  }

  .home-lead-copy p {
    font-size: 1.08rem;
    line-height: 1.95;
  }

  .home-timeline {
    display: grid;
    gap: 1.15rem;
  }

  .home-timeline-item {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.97) 0%, rgba(248, 245, 239, 0.93) 100%);
    border: 1px solid var(--home-border);
    border-radius: var(--home-radius-md);
    box-shadow: 0 18px 46px rgba(27, 41, 41, 0.07);
    padding: 1.45rem 1.6rem;
  }

  .home-timeline-item span {
    color: var(--home-accent);
    display: inline-block;
    font-size: 0.84rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 0.45rem;
    text-transform: uppercase;
  }

  @media (max-width: 991.98px) {
    .home-focus-grid {
      grid-template-columns: 1fr;
    }

    .home-hero-section .resume-biography,
    .home-hero-section .resume-biography > .flex-auto,
    .home-focus-section > .flex,
    .home-timeline-section > .flex,
    .home-hero-section .wg-resume-biography-3 .bio-text,
    .home-hero-section .grid.grid-cols-1.md\:grid-cols-2,
    .home-lead-copy {
      max-width: 100%;
      width: 100%;
    }

    .home-hero-section .wg-resume-biography-3 .portrait-title h2 {
      font-size: clamp(2.3rem, 10vw, 3.5rem);
    }
  }

  @media (max-width: 767.98px) {
    .home-focus-card,
    .home-timeline-item {
      padding: 1.2rem;
    }
  }
</style>
{{ end }}

{{ if or (eq .RelPermalink "/papers/") (eq .RelPermalink "/experience/") }}
<style>

  .page-body .blox-resume-experience ol {

  .page-body .blox-resume-experience ol li > h3,

  .page-body .blox-resume-experience ol li > h3 {

  .page-body .blox-resume-skills .mb-5.text-xl {

  .page-body .blox-resume-skills > .flex.flex-col.items-center.max-w-prose.mx-auto > .mb-6.text-3xl,
  .page-body .experience-language-section > .flex.flex-col.items-center.max-w-prose.mx-auto > .mb-6.text-3xl {

  }

  .page-body .blox-resume-skills .w-full.lg\:w-1\/2 {

  .page-body .blox-resume-skills .skills-content {
    align-items: center;
    display: flex;
    gap: 0.85rem;
    justify-content: center;
    margin-bottom: 1.1rem;
    text-align: center;
  }

  .page-body .blox-resume-skills .skills-name {
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .page-body .blox-resume-skills .skills-icon {

    flex: 0 0 auto;
  }

  .page-body .experience-language-grid {
    display: grid;
    gap: 1.35rem;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .page-body .experience-language-card {
    align-items: center;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(248, 245, 239, 0.92) 100%);
    border: 1px solid rgba(26, 74, 74, 0.08);
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(27, 41, 41, 0.06);
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 220px;
    padding: 1.8rem 1.5rem;

  }

  .page-body .experience-language-icon {
    align-items: center;
    background: linear-gradient(180deg, #e8f5f1 0%, #d7eee6 100%);
    border: 1px solid rgba(23, 107, 107, 0.08);
    border-radius: 999px;
    color: #176b6b;
    display: inline-flex;
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: 1rem;
    font-weight: 700;
    height: 3.5rem;
    justify-content: center;
    margin-bottom: 1rem;
    width: 3.5rem;
  }

  .page-body .experience-language-card h3 {
    color: #1b2929;
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: 1.5rem;
    margin: 0 0 0.45rem;
  }

  .page-body .experience-language-card p {
    color: #566666;
    font-size: 1rem;
    letter-spacing: 0.04em;
    margin: 0;
    text-transform: uppercase;

  @media (max-width: 991.98px) {
    .page-body .blox-markdown > .flex.flex-col.items-center.max-w-prose.mx-auto,
    .page-body .blox-resume-experience > .flex.flex-col.items-center.max-w-prose.mx-auto,
    .page-body .blox-resume-skills > .flex.flex-col.items-center.max-w-prose.mx-auto,
